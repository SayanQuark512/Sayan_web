<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interesting Finds</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="back-nav">
    <a href="index.html">← Back to Home</a>
</div>

<main class="finds-container">

    <h1>Interesting Finds</h1>

    <div class="find-card">

        <h3>BOOKS</h3>

        <p>Some of the best books that help me a lot.</p>

        <ol>
            <li>
                <a href="https://www.feynmanlectures.caltech.edu/" target="_blank">
                    1) The Feynman Lectures on Physics
                </a>
            </li>

            <li>
                <a href="https://davidtong.org/teaching/" target="_blank">
                    2) Lecture Notes of David Tong
                </a>
            </li>
        </ol>

    </div>


    <section class="uf-section">

        <div class="uf-eyebrow">
            Unknown Finds
        </div>

        <button class="uf-avatar-wrap" id="ufTrigger">

            <img
                class="uf-avatar"
                src="images/atanu.png"
                alt="profile"
            >

            <span class="uf-avatar-hint">
                click to find out
            </span>

        </button>

    </section>


    <!-- PASSWORD POPUP -->

    <div class="uf-overlay" id="ufOverlay">

        <div class="uf-modal">

            <div class="uf-modal-head">

                <span>access_gate.py</span>

                <button class="uf-close" id="ufClose">
                    ✕
                </button>

            </div>


            <div id="ufPuzzleView">

                <div class="uf-code" id="ufPuzzleCode"></div>

                <div class="uf-prompt-label">
                    Enter Password
                </div>

                <div class="uf-input-row">

                    <input
                        class="uf-input"
                        id="ufAnswer"
                        type="password"
                        placeholder="Enter password..."
                        autocomplete="off"
                    >

                    <button
                        class="uf-submit"
                        id="ufSubmit"
                    >
                        Unlock ▸
                    </button>

                </div>

                <div
                    class="uf-feedback"
                    id="ufFeedback"
                ></div>

            </div>

        </div>

    </div>

</main>


<script>

(function () {

    /* What will be shown inside the popup */
    const PUZZLE_CODE_HTML = `PASSWORD`;

    /* Correct password */
    const CORRECT_ANSWER = "atanu";

    /* Python file to open */
    const REVEALED_PYTHON_FILE = "1_d ising model.py";


    /* Get HTML elements */

    const overlay =
        document.getElementById('ufOverlay');

    const trigger =
        document.getElementById('ufTrigger');

    const closeBtn =
        document.getElementById('ufClose');

    const puzzleCodeEl =
        document.getElementById('ufPuzzleCode');

    const answerInput =
        document.getElementById('ufAnswer');

    const submitBtn =
        document.getElementById('ufSubmit');

    const feedback =
        document.getElementById('ufFeedback');


    /* Show PASSWORD */

    puzzleCodeEl.textContent = PUZZLE_CODE_HTML;


    /* Open password popup */

    function openModal() {

        overlay.classList.add('uf-open');

        answerInput.value = '';

        feedback.textContent = '';

        feedback.className = 'uf-feedback';

        setTimeout(function () {
            answerInput.focus();
        }, 50);
    }


    /* Close popup */

    function closeModal() {

        overlay.classList.remove('uf-open');

    }


    /* Check password */

    function checkAnswer() {

        const given =
            answerInput.value.trim();


        if (
            given.toLowerCase() ===
            CORRECT_ANSWER.toLowerCase()
        ) {

            feedback.textContent =
                '✔ Correct! Opening...';

            feedback.className =
                'uf-feedback uf-ok';


            setTimeout(function () {

                window.open(
                    REVEALED_PYTHON_FILE,
                    '_blank'
                );

            }, 500);


        } else {

            feedback.textContent =
                '✕ Wrong password';

            feedback.className =
                'uf-feedback uf-err';

        }

    }


    /* Click profile */

    trigger.addEventListener(
        'click',
        openModal
    );


    /* Close button */

    closeBtn.addEventListener(
        'click',
        closeModal
    );


    /* Click outside popup */

    overlay.addEventListener(
        'click',
        function (e) {

            if (e.target === overlay) {
                closeModal();
            }

        }
    );


    /* Unlock button */

    submitBtn.addEventListener(
        'click',
        checkAnswer
    );


    /* Press Enter */

    answerInput.addEventListener(
        'keydown',
        function (e) {

            if (e.key === 'Enter') {
                checkAnswer();
            }

        }
    );

})();

</script>

</body>
</html>
