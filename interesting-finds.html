<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interesting Finds</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="back-nav">
    <a href="index.html">← Back to Home</a>
</div>

<main class="finds-container">

    <h1>Interesting Finds</h1>

    <div class="find-card">

        <h3>BOOKS</h3>

        <p>Some of the best books that help me a lot.</p>

        <ol>
            <li>
                <a href="https://www.feynmanlectures.caltech.edu/" target="_blank">
                    1) The Feynman Lectures on Physics
                </a>
            </li>

            <li>
                <a href="https://davidtong.org/teaching/" target="_blank">
                    2) Lecture Notes of David Tong
                </a>
            </li>
        </ol>

    </div>


    <section class="uf-section">

        <div class="uf-eyebrow">Unknown Finds</div>

        <button class="uf-avatar-wrap" id="ufTrigger">

            <img
                class="uf-avatar"
                src="images/atanu.png"
                alt="profile"
            >

            <span class="uf-avatar-hint">
                click to find out
            </span>

        </button>

    </section>


    <!-- MAIN OVERLAY -->

    <div class="uf-overlay" id="ufOverlay">

        <div class="uf-modal">

            <!-- HEADER -->

            <div class="uf-modal-head">

                <span>access_gate.py</span>

                <button class="uf-close" id="ufClose">
                    ✕
                </button>

            </div>


            <!-- PASSWORD -->

            <div id="ufPuzzleView">

                <div class="uf-code" id="ufPuzzleCode">
                    PASSWORD
                </div>

                <div class="uf-prompt-label">
                    Enter Password
                </div>

                <div class="uf-input-row">

                    <input
                        class="uf-input"
                        id="ufAnswer"
                        type="password"
                        placeholder="Enter password..."
                        autocomplete="off"
                    >

                    <button
                        class="uf-submit"
                        id="ufSubmit"
                    >
                        Unlock ▸
                    </button>

                </div>

                <div
                    class="uf-feedback"
                    id="ufFeedback"
                ></div>

            </div>


            <!-- FILE LIST -->

            <div
                id="ufFileView"
                style="display:none;"
            >

                <div class="uf-reveal-label">
                    ✔ access granted — project files
                </div>

                <div class="uf-file-list">

                    <button
                        class="uf-file"
                        id="ufPythonFile"
                    >
                        📄 quant shoot.py
                    </button>

                </div>

            </div>


            <!-- TEXT VIEWER -->

            <div
                id="ufTextView"
                style="display:none;"
            >

                <div class="uf-reveal-label">

                    <button
                        id="ufBackFiles"
                        class="uf-back-file"
                    >
                        ← Files
                    </button>

                    <span id="ufFileName">
                        1_d ising model.py
                    </span>

                </div>

                <pre
                    id="ufFileContent"
                    class="uf-file-content"
                ></pre>

            </div>


        </div>

    </div>

</main>


<script>

(function () {

    /* =========================
       SETTINGS
    ========================= */

    const CORRECT_ANSWER = "atanu";

    const PYTHON_FILE = "1_d ising model.py";


    /* =========================
       ELEMENTS
    ========================= */

    const overlay =
        document.getElementById("ufOverlay");

    const trigger =
        document.getElementById("ufTrigger");

    const closeBtn =
        document.getElementById("ufClose");

    const answerInput =
        document.getElementById("ufAnswer");

    const submitBtn =
        document.getElementById("ufSubmit");

    const feedback =
        document.getElementById("ufFeedback");

    const puzzleView =
        document.getElementById("ufPuzzleView");

    const fileView =
        document.getElementById("ufFileView");

    const textView =
        document.getElementById("ufTextView");

    const pythonFile =
        document.getElementById("ufPythonFile");

    const fileContent =
        document.getElementById("ufFileContent");

    const fileName =
        document.getElementById("ufFileName");

    const backFiles =
        document.getElementById("ufBackFiles");


    /* =========================
       OPEN PASSWORD WINDOW
    ========================= */

    function openModal() {

        overlay.classList.add("uf-open");

        puzzleView.style.display = "block";
        fileView.style.display = "none";
        textView.style.display = "none";

        answerInput.value = "";

        feedback.textContent = "";

        feedback.className =
            "uf-feedback";

        setTimeout(function () {
            answerInput.focus();
        }, 50);
    }


    /* =========================
       CLOSE WINDOW
    ========================= */

    function closeModal() {

        overlay.classList.remove("uf-open");

    }


    /* =========================
       CHECK PASSWORD
    ========================= */

    function checkAnswer() {

        const given =
            answerInput.value.trim();


        if (
            given.toLowerCase() ===
            CORRECT_ANSWER.toLowerCase()
        ) {

            feedback.textContent =
                "✔ Correct! Access granted.";

            feedback.className =
                "uf-feedback uf-ok";


            setTimeout(function () {

                puzzleView.style.display = "none";

                fileView.style.display = "block";

            }, 400);


        } else {

            feedback.textContent =
                "✕ Wrong password";

            feedback.className =
                "uf-feedback uf-err";

        }

    }


    /* =========================
       OPEN PYTHON FILE
    ========================= */

    pythonFile.addEventListener(
        "click",
        function () {

            fileName.textContent =
                PYTHON_FILE;

            fileContent.textContent =
                "Loading...";

            fileView.style.display =
                "none";

            textView.style.display =
                "block";


            fetch(PYTHON_FILE)

                .then(function (response) {

                    if (!response.ok) {
                        throw new Error(
                            "File could not be loaded."
                        );
                    }

                    return response.text();

                })

                .then(function (text) {

                    fileContent.textContent =
                        text;

                })

                .catch(function (error) {

                    fileContent.textContent =
                        "Unable to load file.\n\n" +
                        error.message;

                });

        }
    );


    /* =========================
       BACK TO FILE LIST
    ========================= */

    backFiles.addEventListener(
        "click",
        function () {

            textView.style.display =
                "none";

            fileView.style.display =
                "block";

        }
    );


    /* =========================
       EVENT LISTENERS
    ========================= */

    trigger.addEventListener(
        "click",
        openModal
    );

    closeBtn.addEventListener(
        "click",
        closeModal
    );

    overlay.addEventListener(
        "click",
        function (e) {

            if (e.target === overlay) {
                closeModal();
            }

        }
    );

    submitBtn.addEventListener(
        "click",
        checkAnswer
    );

    answerInput.addEventListener(
        "keydown",
        function (e) {

            if (e.key === "Enter") {
                checkAnswer();
            }

        }
    );

})();

</script>

</body>
</html>
